[package]
name = "docket-desktop"
version = "0.1.0"
edition = "2021"
description = "Docket desktop — local case files, no network"
license = "Apache-2.0"

[lib]
name = "docket_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "docket-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
docket = { path = ".." }
